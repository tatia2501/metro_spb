<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивная карта метро СПб</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
        }
        
        .metro-line {
            fill: none;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        
        .station {
            cursor: pointer;
            transition: all 0.3s ease;
            filter: drop-shadow(0 0 2px rgba(0,0,0,0.5));
        }
        
        .station:hover {
            r: 8;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.8));
        }
        
        .station-circle {
            fill: #0f172a;
            stroke-width: 3;
        }
        
        .station-label {
            font-size: 15px;
            font-weight: 500;
            fill: #e2e8f0;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        
        .transfer-station {
            stroke-width: 4;
        }
        
        .modal-backdrop {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
        }
        
        .cloud-modal {
            box-shadow: 
                0 20px 25px -5px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.1),
                0 0 50px rgba(0, 0, 0, 0.3);
        }
        
        .line-red { stroke: #ef4444; }
        .station-red { stroke: #ef4444; }
        
        .line-blue { stroke: #3b82f6; }
        .station-blue { stroke: #3b82f6; }
        
        .line-green { stroke: #22c55e; }
        .station-green { stroke: #22c55e; }
        
        .line-orange { stroke: #f97316; }
        .station-orange { stroke: #f97316; }
        
        .line-purple { stroke: #a855f7; }
        .station-purple { stroke: #a855f7; }

        .line-brown { stroke: #8a5f2f; }
        .station-brown { stroke: #8a5f2f; }
        
        .map-container {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }
    </style>
</head>

        </svg>

    <!-- Modal -->
    <div id="station-modal" class="fixed inset-0 modal-backdrop hidden items-center justify-center z-50 p-4">
        <div class="cloud-modal bg-slate-800 rounded-2xl max-w-md w-full p-6 relative transform transition-all scale-95 opacity-0" id="modal-content">
            <!-- Close Button -->
            <button id="close-btn" class="absolute top-4 right-4 text-slate-400 hover:text-white transition-colors p-1 hover:bg-slate-700 rounded-lg">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <!-- Header -->
            <div class="mb-4 pr-8">
                <h2 id="station-name" class="text-2xl font-bold text-white mb-1"></h2>
                <div id="station-line" class="text-sm text-slate-400 flex items-center gap-2">
                    <span id="line-color" class="w-3 h-3 rounded-full"></span>
                    <span id="line-name"></span>
                </div>
            </div>

            <!-- Content -->
            <div class="space-y-4">
                <div id="text-display" class="text-slate-300 leading-relaxed bg-slate-900/50 p-4 rounded-xl border border-slate-700/50">
                    <p id="station-info"></p>
                </div>
                
                <textarea id="text-edit" class="hidden w-full h-32 bg-slate-900 border border-slate-600 rounded-xl p-4 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none" placeholder="Введите описание станции..."></textarea>
            </div>
        </div>
    </div>

    <!-- Подключение данных -->
    <script src="stations-data.js"></script>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // DOM Elements
        const modal = document.getElementById('station-modal');
        const modalContent = document.getElementById('modal-content');
        const closeBtn = document.getElementById('close-btn');
        const editBtn = document.getElementById('edit-btn');
        const saveBtn = document.getElementById('save-btn');
        const textDisplay = document.getElementById('text-display');
        const textEdit = document.getElementById('text-edit');
        const stationInfo = document.getElementById('station-info');
        const stationName = document.getElementById('station-name');
        const lineName = document.getElementById('line-name');
        const lineColor = document.getElementById('line-color');
        const stations = document.querySelectorAll('.station');

        // Line names mapping
        const lineNames = {
            'red': '1 Кировско-Выборгская линия',
            'blue': '2 Московско-Петроградская линия',
            'green': '3 Невско-Василеостровская линия',
            'orange': '4 Лахтинско-Правобережная линия',
            'purple': '5 Фрунзенско-Приморская линия',
            'brown': '6 строящаяся линия'
        };

        const lineColorsHex = {
            'red': '#ef4444',
            'blue': '#3b82f6',
            'green': '#22c55e',
            'orange': '#f97316',
            'purple': '#a855f7',
            'brown': '#8a5f2f'
        };

        let currentStation = null;

        // Open modal
        stations.forEach(station => {
            station.addEventListener('click', function(e) {
                e.stopPropagation();
                const name = this.getAttribute('data-name');
                
                // Получаем данные из внешнего объекта
                const data = STATIONS_DATA[name] || {};
                
                const classList = this.classList.value;
                let color = 'red';
                if (classList.includes('blue')) color = 'blue';
                else if (classList.includes('green')) color = 'green';
                else if (classList.includes('orange')) color = 'orange';
                else if (classList.includes('purple')) color = 'purple';
                else if (classList.includes('brown')) color = 'brown';

                currentStation = this;
                stationName.textContent = name;
                
                // Формируем красивый текст из всех полей данных
                let fullText = `<p class="mb-3">${data.history || "Описание не найдено"}</p>`;
                
                if (data.architecture) {
                    fullText += `<p class="mb-2"><strong>🏛 Архитектура:</strong><br>${data.architecture}</p>`;
                }
                if (data.facts && data.facts.length > 0) {
                    fullText += `<p class="mb-2"><strong>💡 Факты:</strong><ul class="list-disc list-inside">`;
                    data.facts.forEach(fact => {
                        fullText += `<li>${fact}</li>`;
                    });
                    fullText += `</ul></p>`;
                }
                
                stationInfo.innerHTML = fullText;
                textEdit.value = data.history || "";
                
                lineName.textContent = lineNames[color];
                lineColor.style.backgroundColor = lineColorsHex[color];

                // Reset to view mode
                textDisplay.classList.remove('hidden');
                textEdit.classList.add('hidden');
                editBtn.classList.remove('hidden');
                saveBtn.classList.add('hidden');

                modal.classList.remove('hidden');
                modal.classList.add('flex');
                setTimeout(() => {
                    modalContent.classList.remove('scale-95', 'opacity-0');
                    modalContent.classList.add('scale-100', 'opacity-100');
                }, 10);
            });
        });

        // Close modal
        function closeModal() {
            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }

        closeBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', function(e) {
            if (e.target === modal) closeModal();
        });

        // Edit mode
        editBtn.addEventListener('click', function() {
            textDisplay.classList.add('hidden');
            textEdit.classList.remove('hidden');
            editBtn.classList.add('hidden');
            saveBtn.classList.remove('hidden');
            textEdit.focus();
        });

        // Save
        saveBtn.addEventListener('click', function() {
            const newText = textEdit.value;
            stationInfo.innerHTML = `<p class="mb-3">${newText}</p>`;
            if (currentStation) {
                // Обновляем данные в объекте (опционально)
                const name = currentStation.getAttribute('data-name');
                if (STATIONS_DATA[name]) {
                    STATIONS_DATA[name].history = newText;
                }
            }
            
            textDisplay.classList.remove('hidden');
            textEdit.classList.add('hidden');
            editBtn.classList.remove('hidden');
            saveBtn.classList.add('hidden');
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && !modal.classList.contains('hidden')) {
                closeModal();
            }
        });
    </script>
</body>
</html>
