<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивная карта метро СПб</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
        }
        
        .metro-line {
            fill: none;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        
        .station {
            cursor: pointer;
            transition: all 0.3s ease;
            filter: drop-shadow(0 0 2px rgba(0,0,0,0.5));
        }
        
        .station:hover {
            r: 8;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.8));
        }
        
        .station-circle {
            fill: #0f172a;
            stroke-width: 3;
        }
        
        .station-label {
            font-size: 10px;
            font-weight: 500;
            fill: #e2e8f0;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        
        .transfer-station {
            stroke-width: 4;
        }
        
        .modal-backdrop {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
        }
        
        .cloud-modal {
            box-shadow: 
                0 20px 25px -5px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.1),
                0 0 50px rgba(0, 0, 0, 0.3);
        }
        
        .line-red { stroke: #ef4444; }
        .station-red { stroke: #ef4444; }
        
        .line-blue { stroke: #3b82f6; }
        .station-blue { stroke: #3b82f6; }
        
        .line-green { stroke: #22c55e; }
        .station-green { stroke: #22c55e; }
        
        .line-orange { stroke: #f97316; }
        .station-orange { stroke: #f97316; }
        
        .line-purple { stroke: #a855f7; }
        .station-purple { stroke: #a855f7; }

        .line-purple { stroke: #8a5f2f; }
        .station-purple { stroke: #8a5f2f; }
        
        .map-container {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Header -->
    <div class="mb-6 text-center">
        <h1 class="text-3xl font-bold text-white mb-2 flex items-center justify-center gap-3">
            <i data-lucide="map-pin" class="text-red-500"></i>
            История метро Санкт-Петербурга
        </h1>
    </div>

    <!-- Map Container -->
    <div class="map-container rounded-2xl p-8 shadow-2xl border border-slate-700 relative overflow-hidden max-w-6xl w-full">

            <!-- Line 2: Blue (Moskovsko-Petrogradskaya) -->
            <path class="metro-line line-blue" d="M 450 50 L 450 1150" />

            <!-- Line 5: Purple (Frunzensko-Primorskaya) -->

            <path class="metro-line line-brown" d="M 100 910 L 200 910" />

                <circle cx="505" cy="712" r="6" class="station station-purple transfer-station" data-name="Звенигородская" data-info="Пересадка на ст. Пушкинская (красная ветка)." />
                <text x="505" y="712" text-anchor="middle" class="station-label">Звенигородская</text>
                
                <circle cx="560" cy="790" r="5" class="station station-purple transfer-station" data-name="Обводный канал" data-info="Рядом река Обводный канал." />
                <text x="575" y="795" class="station-label">Обводный канал</text>
                
                <circle cx="560" cy="850" r="5" class="station station-purple transfer-station" data-name="Волковская" data-info="Рядом Волковское кладбище." />
                <text x="575" y="855" class="station-label">Волковская</text>
                
                <circle cx="560" cy="910" r="5" class="station station-purple transfer-station" data-name="Бухарестская" data-info="Станция во Фрунзенском районе." />
                <text x="575" y="915" class="station-label">Бухарестская</text>
                
                <circle cx="560" cy="970" r="5" class="station station-purple transfer-station" data-name="Международная" data-info="Станция рядом с Балканской площадью." />
                <text x="575" y="975" class="station-label">Международная</text>
                
                <circle cx="560" cy="1030" r="5" class="station station-purple transfer-station" data-name="Проспект Славы" data-info="Станция во Фрунзенском районе." />
                <text x="575" y="1035" class="station-label">Проспект Славы</text>
                
                <circle cx="560" cy="1090" r="5" class="station station-purple transfer-station" data-name="Дунайская" data-info="Станция рядом с Дунайским проспектом." />
                <text x="575" y="1095" class="station-label">Дунайская</text>
                
                <circle cx="560" cy="1150" r="5" class="station station-purple transfer-station" data-name="Шушары" data-info="Конечная станция фиолетовой ветки." />
                <text x="575" y="1155" class="station-label">Шушары</text>
            </g>

            <!-- Stations Line 6 (Brown) - ? -->
            <g class="station-group" data-line="6" data-color="brown">
                <circle cx="200" cy="830" r="6" class="station station-brown transfer-station" data-name="Путиловская" data-info="" />
                <text x="200" y="830" text-anchor="middle" class="station-label">Путиловская</text>
                
                <circle cx="100" cy="910" r="6" class="station station-brown transfer-station" data-name="Юго-Западная" data-info="" />
                <text x="100" y="910" text-anchor="middle" class="station-label">Юго-Западная</text>
            </g>
        </svg>

    <!-- Modal -->
    <div id="station-modal" class="fixed inset-0 modal-backdrop hidden items-center justify-center z-50 p-4">
        <div class="cloud-modal bg-slate-800 rounded-2xl max-w-md w-full p-6 relative transform transition-all scale-95 opacity-0" id="modal-content">
            <!-- Close Button -->
            <button id="close-btn" class="absolute top-4 right-4 text-slate-400 hover:text-white transition-colors p-1 hover:bg-slate-700 rounded-lg">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <!-- Header -->
            <div class="mb-4 pr-8">
                <h2 id="station-name" class="text-2xl font-bold text-white mb-1"></h2>
                <div id="station-line" class="text-sm text-slate-400 flex items-center gap-2">
                    <span id="line-color" class="w-3 h-3 rounded-full"></span>
                    <span id="line-name"></span>
                </div>
            </div>

            <!-- Content -->
            <div class="space-y-4">
                <div id="text-display" class="text-slate-300 leading-relaxed bg-slate-900/50 p-4 rounded-xl border border-slate-700/50">
                    <p id="station-info"></p>
                </div>
                
                <textarea id="text-edit" class="hidden w-full h-32 bg-slate-900 border border-slate-600 rounded-xl p-4 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none" placeholder="Введите описание станции..."></textarea>
            </div>

            <!-- Actions -->
            <div class="mt-6 flex gap-3 justify-end">
                <button id="edit-btn" class="flex items-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-medium transition-all transform active:scale-95">
                    <i data-lucide="edit-3" class="w-4 h-4"></i>
                    <span>Редактировать</span>
                </button>
                <button id="save-btn" class="hidden flex items-center gap-2 px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-xl font-medium transition-all transform active:scale-95">
                    <i data-lucide="save" class="w-4 h-4"></i>
                    <span>Сохранить</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // DOM Elements
        const modal = document.getElementById('station-modal');
        const modalContent = document.getElementById('modal-content');
        const closeBtn = document.getElementById('close-btn');
        const editBtn = document.getElementById('edit-btn');
        const saveBtn = document.getElementById('save-btn');
        const textDisplay = document.getElementById('text-display');
        const textEdit = document.getElementById('text-edit');
        const stationInfo = document.getElementById('station-info');
        const stationName = document.getElementById('station-name');
        const lineName = document.getElementById('line-name');
        const lineColor = document.getElementById('line-color');
        const stations = document.querySelectorAll('.station');

        // Line names mapping
        const lineNames = {
            'red': '1 Кировско-Выборгская линия',
            'blue': '2 Московско-Петроградская линия',
            'green': '3 Невско-Василеостровская линия',
            'orange': '4 Лахтинско-Правобережная линия',
            'purple': '5 Фрунзенско-Приморская линия'
        };

        const lineColorsHex = {
            'red': '#ef4444',
            'blue': '#3b82f6',
            'green': '#22c55e',
            'orange': '#f97316',
            'purple': '#a855f7'
        };

        let currentStation = null;

        // Open modal
        stations.forEach(station => {
            station.addEventListener('click', function(e) {
                e.stopPropagation();
                const name = this.getAttribute('data-name');
                const info = this.getAttribute('data-info');
                const classList = this.classList.value;
                const color = classList.includes('red') ? 'red' : 
                             classList.includes('blue') ? 'blue' : 
                             classList.includes('green') ? 'green' : 
                             classList.includes('orange') ? 'orange' : 'purple';

                currentStation = this;
                stationName.textContent = name;
                stationInfo.textContent = info;
                textEdit.value = info;
                lineName.textContent = lineNames[color];
                lineColor.style.backgroundColor = lineColorsHex[color];

                // Reset to view mode
                textDisplay.classList.remove('hidden');
                textEdit.classList.add('hidden');
                editBtn.classList.remove('hidden');
                saveBtn.classList.add('hidden');

                modal.classList.remove('hidden');
                modal.classList.add('flex');
                setTimeout(() => {
                    modalContent.classList.remove('scale-95', 'opacity-0');
                    modalContent.classList.add('scale-100', 'opacity-100');
                }, 10);
            });
        });

        // Close modal
        function closeModal() {
            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }

        closeBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', function(e) {
            if (e.target === modal) closeModal();
        });

        // Edit mode
        editBtn.addEventListener('click', function() {
            textDisplay.classList.add('hidden');
            textEdit.classList.remove('hidden');
            editBtn.classList.add('hidden');
            saveBtn.classList.remove('hidden');
            textEdit.focus();
        });

        // Save
        saveBtn.addEventListener('click', function() {
            const newText = textEdit.value;
            stationInfo.textContent = newText;
            if (currentStation) {
                currentStation.setAttribute('data-info', newText);
            }
            
            textDisplay.classList.remove('hidden');
            textEdit.classList.add('hidden');
            editBtn.classList.remove('hidden');
            saveBtn.classList.add('hidden');
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && !modal.classList.contains('hidden')) {
                closeModal();
            }
        });
    </script>
</body>
</html>
