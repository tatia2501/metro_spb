<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Станция метро — Карта СПб</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
        }
        
        .content-card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid #334155;
            transition: all 0.3s ease;
        }
        
        .back-btn {
            transition: all 0.2s ease;
        }
        
        .back-btn:hover {
            transform: translateX(-3px);
            background-color: #334155 !important;
        }
        
        .line-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        
        .year-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: rgba(148, 163, 184, 0.15);
            border: 1px solid #334155;
            border-radius: 20px;
            font-size: 14px;
            color: #94a3b8;
        }
        
        .year-badge i {
            width: 14px;
            height: 14px;
            color: #64748b;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Back Button (Fixed Top-Left) -->
    <a href="index.html" class="back-btn fixed top-4 left-4 z-50 flex items-center gap-2 px-4 py-2 bg-slate-800/90 hover:bg-slate-700 text-white rounded-xl border border-slate-600 backdrop-blur-sm">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
        <span class="hidden sm:inline">Назад к карте</span>
    </a>

    <!-- Header -->
    <header class="pt-20 pb-6 px-4 text-center">
        <div id="station-header" class="max-w-2xl mx-auto">
            <div class="flex items-center justify-center gap-3 mb-3">
                <span id="line-indicator" class="line-indicator"></span>
                <span id="line-name" class="text-sm font-medium text-slate-400"></span>
            </div>
            <h1 id="station-title" class="text-3xl md:text-4xl font-bold text-white mb-3"></h1>
            
            <!-- Year Badge -->
            <div id="year-container" class="mb-4">
                <span class="year-badge">
                    <i data-lucide="calendar" class="w-4 h-4"></i>
                    <span>Год открытия: <span id="station-year" class="text-slate-300 font-medium"></span></span>
                </span>
            </div>
            
            <p id="station-short" class="text-slate-400 text-lg"></p>
        </div>
    </header>

    <!-- Loading State -->
    <div id="loading" class="flex-1 flex items-center justify-center py-20">
        <div class="text-center">
            <div class="w-12 h-12 border-4 border-slate-600 border-t-blue-500 rounded-full animate-spin mx-auto mb-4"></div>
            <p class="text-slate-400">Загрузка данных...</p>
        </div>
    </div>

    <!-- Error State -->
    <div id="error" class="hidden flex-1 flex items-center justify-center py-20 px-4">
        <div class="text-center max-w-md">
            <i data-lucide="alert-circle" class="w-16 h-16 text-red-500 mx-auto mb-4"></i>
            <h2 class="text-xl font-bold text-white mb-2">Станция не найдена</h2>
            <p class="text-slate-400 mb-6">К сожалению, информация об этой станции временно недоступна.</p>
            <a href="index.html" class="inline-flex items-center gap-2 px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-medium transition-colors">
                <i data-lucide="map" class="w-4 h-4"></i>
                Вернуться к карте
            </a>
        </div>
    </div>

    <!-- Content Section (Single Block) -->
    <main id="content" class="hidden flex-1 px-4 pb-8">
        <div class="max-w-2xl mx-auto">
            
            <!-- Single Content Card -->
            <section class="content-card rounded-2xl p-6">
                <div id="station-content" class="text-slate-300 leading-relaxed space-y-4">
                    <!-- Content will be inserted here -->
                </div>
            </section>

        </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 px-4 text-center border-t border-slate-800">
        <p class="text-slate-500 text-sm">
            Интерактивная карта метро Санкт-Петербурга
        </p>
    </footer>

    <!-- Подключение данных -->
    <script src="stations-data.js"></script>

    <script>
        // === Безопасная инициализация иконок ===
        try {
            lucide.createIcons();
        } catch (e) {
            console.warn('Lucide icons not loaded:', e);
        }

        // === Маппинг названий станций (для дублей с -1 / -2) ===
        const STATION_NAME_MAPPING = {
            "Технологический институт": "Технологический институт - 1",
            "Площадь Александра Невского": "Площадь Александра Невского - 1",
        };

        // Функция получения правильного ключа из данных
        function getStationKey(name, line = null) {
            if (STATIONS_DATA[name]) return name;
            if (STATION_NAME_MAPPING[name] && !line) {
                return STATION_NAME_MAPPING[name];
            }
            if (line) {
                if (name === "Технологический институт") {
                    return line === 'blue' ? "Технологический институт - 2" : "Технологический институт - 1";
                }
                if (name === "Площадь Александра Невского") {
                    return line === 'orange' ? "Площадь Александра Невского - 2" : "Площадь Александра Невского - 1";
                }
            }
            return name;
        }

        // Цвета линий для индикатора
        const lineColors = {
            'red': '#ef4444',
            'blue': '#3b82f6',
            'green': '#22c55e',
            'orange': '#f97316',
            'purple': '#a855f7',
            'brown': '#8a5f2f'
        };

        // Названия линий
        const lineNames = {
            'red': 'Кировско-Выборгская линия',
            'blue': 'Московско-Петроградская линия',
            'green': 'Невско-Василеостровская линия',
            'orange': 'Лахтинско-Правобережная линия',
            'purple': 'Фрунзенско-Приморская линия',
            'brown': 'Строящаяся линия'
        };

        // Форматирование текста с переносами строк
        function formatText(text) {
            if (!text) return '';
            return text
                .split('\n')
                .filter(line => line.trim())
                .map(line => `<p>${line.trim()}</p>`)
                .join('');
        }

        // Загрузка данных станции
        function loadStation() {
            try {
                const params = new URLSearchParams(window.location.search);
                const stationName = params.get('name');
                const stationLine = params.get('line');
                
                const loading = document.getElementById('loading');
                const error = document.getElementById('error');
                const content = document.getElementById('content');
                
                if (!stationName) {
                    console.error('❌ Нет параметра name в URL');
                    loading.classList.add('hidden');
                    error.classList.remove('hidden');
                    return;
                }
                
                // Проверка: существует ли объект с данными
                if (typeof STATIONS_DATA === 'undefined') {
                    console.error('❌ Файл stations-data.js не загружен!');
                    loading.classList.add('hidden');
                    error.querySelector('h2').textContent = 'Ошибка загрузки';
                    error.querySelector('p').textContent = 'Не удалось загрузить данные о станциях';
                    error.classList.remove('hidden');
                    return;
                }
                
                // Получаем правильный ключ для поиска данных
                const dataKey = getStationKey(stationName, stationLine);
                const data = STATIONS_DATA[dataKey];
                
                if (!data) {
                    console.error('❌ Станция не найдена:', stationName, '(искали ключ: ' + dataKey + ')');
                    console.log('📋 Доступные станции:', Object.keys(STATIONS_DATA).slice(0, 10), '...');
                    loading.classList.add('hidden');
                    error.classList.remove('hidden');
                    return;
                }
                
                // Заполняем заголовок
                document.getElementById('station-title').textContent = stationName;
                document.getElementById('station-short').textContent = '';
                
                // === Год открытия ===
                const yearElement = document.getElementById('station-year');
                const yearContainer = document.getElementById('year-container');
                if (data.year && data.year.trim()) {
                    yearElement.textContent = data.year;
                    yearElement.classList.remove('italic', 'text-slate-600');
                    yearContainer.classList.remove('hidden');
                } else {
                    yearElement.textContent = 'не указан';
                    yearElement.classList.add('italic', 'text-slate-600');
                }
                
                // === Определяем линию станции ===
                let stationLineDetected = 'red';
                if (stationName.includes('Парнас') || stationName.includes('Купчино') || 
                    stationName.includes('Московская') || stationName.includes('Петроградская') ||
                    stationName.includes('Горьковская') || stationName.includes('Сенная')) {
                    stationLineDetected = 'blue';
                } else if (stationName.includes('Беговая') || stationName.includes('Рыбацкое') || 
                          stationName.includes('Василеостровская') || stationName.includes('Гостиный') ||
                          stationName.includes('Маяковская') || stationName.includes('Елизаровская')) {
                    stationLineDetected = 'green';
                } else if (stationName.includes('Горный институт') || stationName.includes('Дыбенко') || 
                          stationName.includes('Спасская') || stationName.includes('Достоевская') ||
                          stationName.includes('Ладожская') || stationName.includes('Новочеркасская')) {
                    stationLineDetected = 'orange';
                } else if (stationName.includes('Комендантский') || stationName.includes('Шушары') || 
                          stationName.includes('Адмиралтейская') || stationName.includes('Садовая') ||
                          stationName.includes('Звенигородская') || stationName.includes('Спортивная')) {
                    stationLineDetected = 'purple';
                }
                
                document.getElementById('line-indicator').style.backgroundColor = lineColors[stationLineDetected];
                document.getElementById('line-name').textContent = lineNames[stationLineDetected];
                
                // === Заполняем единственный блок контента ===
                const stationContent = document.getElementById('station-content');
                if (data.history && data.history.trim()) {
                    stationContent.innerHTML = formatText(data.history);
                } else {
                    stationContent.innerHTML = '<p class="text-slate-500 italic">Информация о станции будет добавлена позже...</p>';
                }
                
                // === Показываем контент, скрываем загрузку ===
                loading.classList.add('hidden');
                content.classList.remove('hidden');
                
            } catch (err) {
                console.error('💥 Ошибка при загрузке станции:', err);
                document.getElementById('loading').classList.add('hidden');
                const error = document.getElementById('error');
                error.classList.remove('hidden');
                error.querySelector('h2').textContent = 'Ошибка';
                error.querySelector('p').textContent = 'Не удалось загрузить информацию о станции. Проверьте консоль для деталей.';
            }
        }

        // Запускаем загрузку после готовности DOM
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadStation);
        } else {
            loadStation();
        }
    </script>
</body>
</html>
